name: Release

# Pushing a tag such as v0.2.0 publishes static Linux binaries that
# scripts/install.sh downloads, so installs no longer need a toolchain.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create the release under (e.g. v0.2.0)
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl + zig gives a fully static binary that runs on any distro/glibc
      # (CentOS 7 through current releases) without extra libraries.
      - name: Install cargo-zigbuild
        run: pip3 install --user cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          name="linxpanel-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/linxpanel" "dist/${name}/linxpanel"
          cp scripts/lp "dist/${name}/lp"
          chmod 755 "dist/${name}/linxpanel" "dist/${name}/lp"
          tar -C "dist/${name}" -czf "dist/${name}.tar.gz" linxpanel lp
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Smoke test
        if: matrix.arch == 'x86_64'
        run: |
          tar -xzf dist/linxpanel-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/linxpanel" --version

      - uses: actions/upload-artifact@v4
        with:
          name: linxpanel-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linxpanel-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
