name: Release

# Pushing a tag such as v0.2.0 publishes static Linux binaries for every
# supported architecture; scripts/install.sh downloads the one matching
# `uname -m`, so installs need no toolchain.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create the release under (e.g. v0.2.0)
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl + zig: fully static, runs on any distro and glibc version.
          - { target: x86_64-unknown-linux-musl, arch: x86_64 }
          - { target: aarch64-unknown-linux-musl, arch: aarch64 }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7 }
          - { target: i686-unknown-linux-musl, arch: i686 }
          - { target: riscv64gc-unknown-linux-musl, arch: riscv64 }
          - { target: loongarch64-unknown-linux-musl, arch: loongarch64 }
          - { target: powerpc64le-unknown-linux-musl, arch: ppc64le }
          # No musl std for s390x on stable Rust: link against glibc 2.17
          # (CentOS 7 era), which every s390x distro still in use exceeds.
          - { target: s390x-unknown-linux-gnu, zig_target: s390x-unknown-linux-gnu.2.17, arch: s390x, qemu_ld_prefix: /usr/s390x-linux-gnu, extra_apt: libc6-s390x-cross }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: pip3 install --user cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.zig_target || matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          name="linxpanel-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/linxpanel" "dist/${name}/linxpanel"
          cp scripts/lp "dist/${name}/lp"
          chmod 755 "dist/${name}/linxpanel" "dist/${name}/lp"
          tar -C "dist/${name}" -czf "dist/${name}.tar.gz" linxpanel lp
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      # Every architecture is executed before it is published: natively for
      # x86_64 / i686, under qemu-user for the rest.
      - name: Smoke test
        env:
          QEMU_LD_PREFIX: ${{ matrix.qemu_ld_prefix }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static ${{ matrix.extra_apt }}
          mkdir -p "$RUNNER_TEMP/pkg"
          tar -xzf "dist/linxpanel-linux-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP/pkg"
          bash scripts/ci/smoke.sh "$RUNNER_TEMP/pkg/linxpanel"

      - uses: actions/upload-artifact@v4
        with:
          name: linxpanel-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linxpanel-*
          merge-multiple: true
          path: dist
      - name: Checksums and notes
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          # A mirror of the release is a plain copy of these files: the panel
          # reads latest.json and runs install.sh from it (Settings > Panel update).
          cp scripts/install.sh dist/install.sh
          jq -n --arg tag "$RELEASE_TAG" --arg url "https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG" \
            '{tag: $tag, url: $url, notes: "See \($url)"}' > dist/latest.json
          cat > notes.md <<'EOF'
          ## Install / 安装

          ```bash
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh)"
          ```

          Re-running the same command upgrades in place (with automatic rollback). 重复执行即升级（失败自动回滚）。

          | Architecture | Package |
          | --- | --- |
          | x86_64 / amd64 | `linxpanel-linux-x86_64.tar.gz` |
          | ARM64 / aarch64 | `linxpanel-linux-aarch64.tar.gz` |
          | ARMv7 (32-bit, armhf) | `linxpanel-linux-armv7.tar.gz` |
          | x86 32-bit (i686) | `linxpanel-linux-i686.tar.gz` |
          | RISC-V 64 | `linxpanel-linux-riscv64.tar.gz` |
          | LoongArch64 (龙芯) | `linxpanel-linux-loongarch64.tar.gz` |
          | POWER (ppc64le) | `linxpanel-linux-ppc64le.tar.gz` |
          | IBM Z (s390x) | `linxpanel-linux-s390x.tar.gz` |
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: notes.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
            dist/latest.json
            dist/install.sh
